name: QA
on:
  push:
    branches: ["main"]
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check app.js
      - name: Check required files
        run: test -f index.html && test -f style.css && test -f sw.js && test -f manifest.json
