<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Boxing Strength Tracker — fuerza, potencia y seguimiento para boxeo">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<title>Boxing Strength Tracker</title>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">BOXING STRENGTH</div>
      <h1>Tracker</h1>
      <p>3 días de fuerza · antes del boxeo</p>
    </div>
    <button id="installBtn" class="ghost hidden" type="button">Instalar</button>
  </header>

  <nav class="tabs" aria-label="Rutinas">
    <button class="tab active" data-day="A" type="button">Día A</button>
    <button class="tab" data-day="B" type="button">Día B</button>
    <button class="tab" data-day="C" type="button">Día C</button>
    <button class="tab" data-view="history" type="button">Historial</button>
  </nav>

  <section id="workoutView">
    <div class="session-head">
      <div>
        <span class="pill" id="dayPill">A · Fuerza + potencia</span>
        <h2 id="dayTitle">Día A</h2>
        <p id="dayDescription"></p>
      </div>
      <div class="session-stats">
        <strong id="completedCount">0/0</strong>
        <span>series</span>
      </div>
    </div>

    <div id="alertBox" class="alert hidden"></div>
    <div id="exerciseList"></div>

    <section class="finish card">
      <div class="section-title">Cierre de sesión</div>
      <div class="form-grid">
        <label>RPE pesas
          <select id="sessionRpe"><option value="">—</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select>
        </label>
        <label>Boxeo después
          <select id="boxingFeel"><option value="">—</option><option value="5">5 · muy bien</option><option value="4">4 · bien</option><option value="3">3 · normal</option><option value="2">2 · pesado</option><option value="1">1 · muy pesado</option></select>
        </label>
      </div>
      <label class="full">Notas
        <textarea id="notes" rows="3" placeholder="Energía, técnica, molestias, cómo fue el boxeo…"></textarea>
      </label>
      <button id="saveSession" class="primary" type="button">Guardar sesión</button>
    </section>
  </section>

  <section id="historyView" class="hidden">
    <div class="session-head">
      <div><span class="pill">Datos locales</span><h2>Historial</h2><p>Se guarda en este dispositivo. Nada se sube al repositorio.</p></div>
    </div>
    <div id="historyList"></div>
    <button id="clearHistory" class="danger" type="button">Borrar historial de este dispositivo</button>
  </section>
</main>

<div id="timer" class="timer hidden" role="dialog" aria-live="polite">
  <div class="timer-card">
    <div class="muted">Descanso</div>
    <strong id="timerValue">01:30</strong>
    <div class="timer-actions"><button id="timerSkip" type="button">Saltar</button><button id="timerPlus" type="button">+15 s</button></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
